name: Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: QtAgg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libzbar0
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python -m pytest
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test installed wheel outside the checkout
        run: |
          cd "$(mktemp -d)"
          python -m pytest "$GITHUB_WORKSPACE/tests"
